name: Apply custom paywall type fixes

on:
  push:
    branches: [feat/revenuecat-custom-paywall-complete]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/revenuecat-custom-paywall-complete
      - name: Apply exact TypeScript fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          client = Path('apps/mobile/src/features/billing/revenuecat-client.ts')
          text = client.read_text()
          for old, new in [
              ('purchasePackage(offered);', 'purchasePackage(offered!);'),
              ('offering: snapshot.offering,', 'offering: snapshot.offering!,'),
          ]:
              if text.count(old) != 1:
                  raise SystemExit(f'expected one client match: {old!r}')
              text = text.replace(old, new)
          client.write_text(text)

          test = Path('apps/mobile/src/features/billing/revenuecat-client.test.ts')
          text = test.read_text()
          old = "const unrelatedOffering = {\n  identifier: 'default',\n  availablePackages: [],\n} as PurchasesOffering;"
          new = "const unrelatedOffering = {\n  identifier: 'default',\n  availablePackages: [],\n} as unknown as PurchasesOffering;"
          if text.count(old) != 1:
              raise SystemExit('expected one unrelated offering match')
          test.write_text(text.replace(old, new))
          PY
          rm .github/workflows/fix-custom-paywall-typecheck.yml
      - name: Commit fixes and remove helper workflow
        run: |
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: satisfy RevenueCat custom paywall types'
          git push origin HEAD:feat/revenuecat-custom-paywall-complete
