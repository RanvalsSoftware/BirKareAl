name: Apply RevenueCat completion v2

on:
  push:
    branches: [feat/revenuecat-custom-paywall-complete]
    paths:
      - 'scripts/apply-revenuecat-completion-v2.mjs'
      - '.github/workflows/apply-revenuecat-completion-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-revenuecat-completion-v2
  cancel-in-progress: false

jobs:
  apply-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/revenuecat-custom-paywall-complete
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply complete mobile and server patch
        run: node scripts/apply-revenuecat-completion-v2.mjs
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.18.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @birkare/database exec prisma generate
      - name: Typecheck mobile
        run: pnpm --filter @birkare/mobile typecheck
      - name: Typecheck API
        run: pnpm --filter @birkare/api typecheck
      - name: Run RevenueCat mobile tests
        run: pnpm --filter @birkare/mobile exec vitest run src/features/billing/revenuecat-client.test.ts src/features/billing/paywall-model.test.ts config/revenuecat.test.ts
      - name: Run RevenueCat API tests
        run: pnpm --filter @birkare/api exec vitest run src/modules/billing/revenuecat.service.test.ts
      - name: Remove one-time patch machinery
        run: |
          rm -f scripts/apply-revenuecat-completion.mjs scripts/apply-revenuecat-completion-v2.mjs
          rm -f .github/workflows/apply-revenuecat-completion.yml .github/workflows/apply-revenuecat-completion-v2.yml
          rm -f docs/revenuecat-completion-trigger.md docs/revenuecat-completion-marker-2.md
      - name: Commit completed integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'feat: complete RevenueCat custom paywall and server sync'
            git push origin HEAD:feat/revenuecat-custom-paywall-complete
          fi
