name: Release hardening validation

on:
  push:
    branches:
      - fix/release-hardening-photorealism
  pull_request:
    branches:
      - feat/human-photorealism-source-fidelity

permissions:
  contents: read

concurrency:
  group: release-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.18.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @birkare/database exec prisma generate
      - name: Typecheck core workspaces
        run: |
          pnpm --filter @birkare/database typecheck
          pnpm --filter @birkare/ai typecheck
          pnpm --filter @birkare/api typecheck
          pnpm --filter @birkare/mobile typecheck
          pnpm --filter @birkare/worker typecheck
      - name: Run API regression suite
        run: pnpm --filter @birkare/api test
      - name: Run mobile regression suite
        run: pnpm --filter @birkare/mobile test
      - name: Expo doctor
        run: pnpm --filter @birkare/mobile doctor
      - name: Validate Android native config
        env:
          EXPO_PUBLIC_APP_ENV: development
          EXPO_PUBLIC_REVENUECAT_OFFERING_ID: birkare_pro
        run: pnpm --filter @birkare/mobile exec expo prebuild --platform android --no-install
      - name: Validate iOS native config
        env:
          EXPO_PUBLIC_APP_ENV: development
          EXPO_PUBLIC_REVENUECAT_OFFERING_ID: birkare_pro
        run: pnpm --filter @birkare/mobile exec expo prebuild --platform ios --no-install

  recovery-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: birkare_recovery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d birkare_recovery_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/birkare_recovery_test?schema=public
      RECOVERY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/birkare_recovery_test?schema=public
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@10.18.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @birkare/database exec prisma generate
      - run: pnpm --filter @birkare/database prisma:deploy
      - name: Verify auth deletion/recovery against PostgreSQL
        run: pnpm --filter @birkare/api exec tsx --test src/modules/auth/auth.registration-recovery.test.ts
