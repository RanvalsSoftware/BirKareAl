name: Compile reviewed localization resources
on:
  push:
    branches: [feature7langague_update]
    paths:
      - apps/mobile/src/i18n/reviewed/**
      - scripts/language-merge.mjs
      - scripts/language-finalize.mjs
      - .github/workflows/language-apply.yml
permissions:
  contents: write
concurrency:
  group: language-apply
  cancel-in-progress: true
jobs:
  apply:
    if: github.repository == 'RanvalsSoftware/BirKareAl' && github.ref == 'refs/heads/feature7langague_update'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature7langague_update
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@10.18.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Compile reviewed English resources
        run: node scripts/language-finalize.mjs
      - run: pnpm --filter @birkare/database exec prisma generate
      - name: Typecheck and test before committing generated files
        run: |
          pnpm --filter @birkare/mobile typecheck
          pnpm --filter @birkare/api typecheck
          pnpm --filter @birkare/mobile exec vitest run src/i18n src/features/auth src/features/create src/features/trends
      - name: Commit compiled resources to the requested feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/src/i18n/locales/copy-en.json apps/mobile/src/features/auth/auth-ui-input.test.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'feat(i18n): compile complete reviewed English translations'
            git push origin HEAD:refs/heads/feature7langague_update
          fi
      - name: Full mobile and backend regression suite
        run: |
          pnpm --filter @birkare/mobile test
          pnpm --filter @birkare/api exec tsx --test src/modules/auth/google-id-token.service.test.ts src/modules/generations/trend-quality.test.ts
