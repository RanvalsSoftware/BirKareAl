name: Apply custom BirKare RevenueCat paywall patches

on:
  push:
    branches: [feat/revenuecat-custom-paywall-complete]

permissions:
  contents: write

concurrency:
  group: apply-custom-revenuecat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/revenuecat-custom-paywall-complete
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Apply custom paywall wiring patches
        run: node scripts/apply-custom-paywall-patches.cjs
      - name: Use repository package manager
        run: |
          corepack enable
          corepack prepare pnpm@10.18.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Format changed files
        run: >-
          pnpm exec prettier --write
          apps/mobile/src/features/billing/CustomProPaywall.tsx
          apps/mobile/src/features/billing/paywall-model.ts
          apps/mobile/src/features/billing/paywall-model.test.ts
          apps/mobile/src/features/billing/SubscriptionCard.tsx
          apps/mobile/src/features/billing/revenuecat-client.ts
          apps/mobile/src/features/billing/revenuecat-client.test.ts
          apps/mobile/src/features/billing/revenuecat.tsx
          apps/mobile/app/pro.tsx
          apps/mobile/app/_layout.tsx
          'apps/mobile/app/(tabs)/credits.tsx'
          apps/mobile/config/revenuecat.cjs
          apps/mobile/config/revenuecat.d.cts
          apps/mobile/config/revenuecat.test.ts
          apps/api/src/modules/billing/billing.routes.ts
          .env.example
          .github/workflows/revenuecat-validation.yml
      - name: Typecheck mobile application
        run: pnpm --filter @birkare/mobile typecheck
      - name: Run RevenueCat lifecycle and paywall tests
        run: >-
          pnpm --filter @birkare/mobile exec vitest run
          src/features/billing/revenuecat-client.test.ts
          src/features/billing/paywall-model.test.ts
          config/revenuecat.test.ts
      - name: Typecheck API product policy
        run: pnpm --filter @birkare/api typecheck
      - name: Validate Android native project generation
        env:
          EXPO_PUBLIC_APP_ENV: development
        run: pnpm --filter @birkare/mobile exec expo prebuild --platform android --no-install
      - name: Commit validated integration
        run: |
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: complete custom BirKare Pro paywall wiring'
          git push origin HEAD:feat/revenuecat-custom-paywall-complete
