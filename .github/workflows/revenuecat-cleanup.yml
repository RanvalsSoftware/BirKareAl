name: RevenueCat branch cleanup

on:
  push:
    branches: [feat/revenuecat-custom-paywall-complete]
    paths:
      - '.github/workflows/revenuecat-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: revenuecat-branch-cleanup
  cancel-in-progress: false

jobs:
  verify-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/revenuecat-custom-paywall-complete
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify expected implementation files
        run: |
          test -f apps/mobile/app/pro.tsx
          test -f apps/mobile/src/features/billing/CustomProPaywall.tsx
          test -f apps/mobile/src/features/billing/paywall-model.ts
          test -f apps/api/src/modules/billing/revenuecat.service.ts
          test -f apps/api/src/modules/billing/revenuecat.service.test.ts
          test -f apps/api/src/modules/billing/pro-access.ts
          test -f packages/database/prisma/migrations/20260911153000_revenuecat_credit_idempotency/migration.sql
      - name: Install and validate before cleanup
        run: |
          corepack enable
          corepack prepare pnpm@10.18.0 --activate
          pnpm install --frozen-lockfile
          pnpm --filter @birkare/database exec prisma generate
          pnpm --filter @birkare/mobile typecheck
          pnpm --filter @birkare/api typecheck
          pnpm --filter @birkare/mobile exec vitest run src/features/billing/revenuecat-client.test.ts src/features/billing/paywall-model.test.ts config/revenuecat.test.ts
          pnpm --filter @birkare/api exec vitest run src/modules/billing/revenuecat.service.test.ts
      - name: Remove temporary patch workflows and scripts
        run: |
          rm -f scripts/apply-revenuecat-completion.mjs
          rm -f scripts/apply-revenuecat-completion-v2.mjs
          rm -f scripts/apply-revenuecat-completion-v3.mjs
          rm -f scripts/apply-revenuecat-completion-v4.mjs
          rm -f .github/workflows/apply-revenuecat-completion.yml
          rm -f .github/workflows/apply-revenuecat-completion-v2.yml
          rm -f .github/workflows/apply-revenuecat-completion-v4.yml
          rm -f .github/workflows/apply-revenuecat-completion-v5.yml
          rm -f .github/workflows/apply-revenuecat-completion-v6.yml
          rm -f .github/workflows/revenuecat-finalize.yml
          rm -f .github/workflows/revenuecat-hardening.yml
          rm -f .github/workflows/revenuecat-hardening-v2.yml
          rm -f docs/revenuecat-completion-trigger.md
          rm -f docs/revenuecat-completion-marker-2.md
          rm -f .github/workflows/revenuecat-cleanup.yml
      - name: Commit clean verified branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: clean temporary RevenueCat patch tooling' || true
          git fetch origin feat/revenuecat-custom-paywall-complete
          git rebase origin/feat/revenuecat-custom-paywall-complete
          git push origin HEAD:feat/revenuecat-custom-paywall-complete
