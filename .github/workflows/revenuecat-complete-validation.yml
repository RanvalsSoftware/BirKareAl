name: RevenueCat complete validation

on:
  push:
    branches: [feat/revenuecat-custom-paywall-complete]
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'apps/api/**'
      - 'packages/config/**'
      - 'packages/database/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/revenuecat-complete-validation.yml'

permissions:
  contents: read

concurrency:
  group: revenuecat-complete-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Mobile, API, Prisma and RevenueCat tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Activate repository package manager
        run: |
          corepack enable
          corepack prepare pnpm@10.18.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @birkare/database exec prisma generate
      - name: Typecheck mobile
        run: pnpm --filter @birkare/mobile typecheck
      - name: Typecheck API
        run: pnpm --filter @birkare/api typecheck
      - name: Run RevenueCat mobile tests
        run: pnpm --filter @birkare/mobile exec vitest run src/features/billing/revenuecat-client.test.ts src/features/billing/paywall-model.test.ts config/revenuecat.test.ts
      - name: Run RevenueCat API tests
        run: pnpm --filter @birkare/api exec tsx --test src/modules/billing/revenuecat.service.test.ts src/modules/billing/revenuecat.credit-packs.test.ts
      - name: Validate Android native config
        env:
          EXPO_PUBLIC_APP_ENV: development
          EXPO_PUBLIC_REVENUECAT_OFFERING_ID: birkare_pro
        run: pnpm --filter @birkare/mobile exec expo prebuild --platform android --no-install
