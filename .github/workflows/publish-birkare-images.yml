name: Publish BirKare backend images

on:
  push:
    branches: [feat/revenuecat-custom-paywall-complete]
    paths:
      - '.github/workflows/publish-birkare-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-birkare-backend-images
  cancel-in-progress: false

env:
  RELEASE_TAG: 2026.09.18-1
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/ranvals-software/birkare-api
  WORKER_IMAGE: ghcr.io/ranvals-software/birkare-worker

jobs:
  publish:
    name: Build, audit and push API + worker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API image for linux/amd64
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            -f infra/docker/api.Dockerfile \
            -t "${API_IMAGE}:${RELEASE_TAG}" \
            -t "${API_IMAGE}:latest" \
            .

      - name: Build worker image for linux/amd64
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            -f infra/docker/worker.Dockerfile \
            -t "${WORKER_IMAGE}:${RELEASE_TAG}" \
            -t "${WORKER_IMAGE}:latest" \
            .

      - name: Audit release images before publishing
        run: |
          node scripts/audit-release-images.mjs \
            "${API_IMAGE}:${RELEASE_TAG}" \
            "${WORKER_IMAGE}:${RELEASE_TAG}"

      - name: Verify image architecture
        run: |
          test "$(docker image inspect "${API_IMAGE}:${RELEASE_TAG}" --format '{{.Architecture}}')" = "amd64"
          test "$(docker image inspect "${WORKER_IMAGE}:${RELEASE_TAG}" --format '{{.Architecture}}')" = "amd64"

      - name: Push API release and latest tags
        run: |
          docker push "${API_IMAGE}:${RELEASE_TAG}"
          docker push "${API_IMAGE}:latest"

      - name: Push worker release and latest tags
        run: |
          docker push "${WORKER_IMAGE}:${RELEASE_TAG}"
          docker push "${WORKER_IMAGE}:latest"

      - name: Verify published manifests
        run: |
          docker buildx imagetools inspect "${API_IMAGE}:${RELEASE_TAG}"
          docker buildx imagetools inspect "${WORKER_IMAGE}:${RELEASE_TAG}"
