name: Finalize language runtime and mail support
on:
  push:
    branches: [feature7langague_update]
    paths:
      - scripts/language-hardening.mjs
      - .github/workflows/language-hardening.yml
permissions:
  contents: read
concurrency:
  group: language-hardening-feature-only
  cancel-in-progress: true
jobs:
  apply:
    if: github.repository == 'RanvalsSoftware/BirKareAl' && github.ref == 'refs/heads/feature7langague_update'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature7langague_update
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@10.18.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Complete deterministic source edits
        run: node scripts/language-hardening.mjs
      - run: pnpm --filter @birkare/database exec prisma generate
      - name: Typecheck mobile and backend
        run: |
          pnpm --filter @birkare/mobile typecheck
          pnpm --filter @birkare/api typecheck
      - name: Complete mobile regression suite
        run: pnpm --filter @birkare/mobile test
      - name: Backend localization and existing security regressions
        run: >-
          pnpm --filter @birkare/api exec tsx --test
          src/services/localization.test.ts
          src/services/mail.service.test.ts
          src/modules/auth/auth.service.test.ts
          src/modules/auth/google-id-token.service.test.ts
          src/modules/auth/apple-id-token.service.test.ts
          src/modules/auth/account-security.test.ts
          src/modules/billing/revenuecat.service.test.ts
          src/modules/generations/trends.test.ts
          src/modules/generations/trend-quality.test.ts
          src/modules/generations/runtime.test.ts
      - name: Commit tested changes only to the requested feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/src/i18n/engine.ts apps/mobile/src/api/client.ts apps/mobile/src/features/auth/validation.ts apps/mobile/src/features/settings/account-profile.ts apps/mobile/app.config.ts 'apps/mobile/app/generations/[id].tsx' apps/api/src/services/http.ts apps/api/src/services/mail.service.ts apps/api/src/modules/auth/auth.service.ts
          if ! git diff --cached --quiet; then
            git commit -m 'fix(i18n): finish localized validation, API feedback and transactional mail'
            git push origin HEAD:refs/heads/feature7langague_update
          fi
          echo "Validated feature commit: $(git rev-parse HEAD)"
